<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Autorizar acesso — Rateio de Faturas</title>
<style>
  :root{
    --bg:#F5F5F7; --surface:#FFFFFF; --text:#1D1D1F; --mut:#6E6E73;
    --accent:#0071E3; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --surface:#1C1C1E; --text:#F5F5F7; --mut:#98989D; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); display:flex;
    align-items:center; justify-content:center; padding:24px;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--surface); border-radius:var(--radius); padding:28px 22px;
    width:100%; max-width:360px; text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
  }
  h1{font-size:19px;margin:0 0 8px}
  p{color:var(--mut);font-size:14px;margin:0 0 20px}
  button{
    width:100%; border:0; border-radius:12px; padding:14px 16px; font-size:16px;
    font-weight:600; background:var(--accent); color:#fff; cursor:pointer;
    font-family:inherit;
  }
  button[disabled]{opacity:.6;cursor:default}
  .err{color:#FF3B30;font-size:13px;margin-top:14px;min-height:1em}
  .spinner{
    width:22px;height:22px;border:2.5px solid rgba(128,128,128,.3);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
  <div id="spinner" class="spinner" hidden></div>
  <h1>Autorizar acesso ao Gmail</h1>
  <p>O Rateio de Faturas precisa da sua autorização para ler as mensagens que contêm faturas. Você será direcionado à página oficial do Google.</p>
  <button type="button" id="go">Continuar com o Google</button>
  <div class="err" id="err" role="alert"></div>
</main>
<script type="module" src="oauth-relay.js"></script>
</body>
</html>
